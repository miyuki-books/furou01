name: 日次 記事生成

on:
  schedule:
    # 毎時0分は GitHub 全体のスケジュールが集中して遅延・取りこぼしが起きやすいので
    # 分をずらしてある。実際 8/26 の 22:00 UTC 分は Actions 障害で発火しなかった。
    - cron: '17 22 * * *' # 22:17 UTC = 07:17 JST（本番）
    - cron: '17 3 * * *'  # 03:17 UTC = 12:17 JST（取りこぼしの追いかけ。済んでいれば即終了する）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# ランナーはUTCで動く。日次ジョブは 22:00 UTC = 翌07:00 JST なので、
# UTCの日付で記事を作ると全部が1日前の日付になり、同じ日付の記事が並んで一覧順も崩れる。
# 実際に 8/10 に書いた記事が 8/9 付で作られた。ランナーごとJSTに揃える。
env:
  TZ: Asia/Tokyo

concurrency:
  group: furou01-daily
  cancel-in-progress: false

jobs:
  # 追いかけ実行が2本目の記事を書いてしまわないための門番。
  # 「今日(JST)ぶんが既に済んでいるか」だけを見て、済んでいれば以降を全部飛ばす。
  guard:
    runs-on: ubuntu-latest
    outputs:
      already: ${{ steps.check.outputs.already }}
    steps:
      - uses: actions/checkout@v4

      - name: 今日ぶんが済んでいるか確認
        id: check
        run: |
          today=$(date +%F)  # TZ=Asia/Tokyo
          last=$(node -e "console.log(JSON.parse(require('fs').readFileSync('state/health.json','utf8')).lastSuccessfulRun || '')")
          # health.json の更新漏れに備えて、今日付の記事の有無も見る
          if [ "$last" = "$today" ] || ls content/$today-*.md >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$today ぶんは実行済みです。何もしません。"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$today ぶんは未実行です。続行します。"
          fi

  generate:
    needs: guard
    if: needs.guard.outputs.already != 'true'
    runs-on: ubuntu-latest
    outputs:
      halted: ${{ steps.halt.outputs.halted }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 中間判定で「ai-staff[bot] 以外のコミット数」を数えるため全履歴が要る
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Claude Code をインストール
        run: npm install -g @anthropic-ai/claude-code

      - name: 実行前の記事数を記録
        id: pre
        run: echo "count=$(ls content/*.md 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      # halted のまま走らせても AI社員は「停止中です」と言って終わるだけ。
      # トークンを使う前に、ここで落とす。
      - name: 既に停止中でないか確認
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          halted=$(node -e "console.log(JSON.parse(require('fs').readFileSync('state/health.json','utf8')).halted === true)")
          if [ "$halted" = "true" ]; then
            reason=$(node -e "console.log(JSON.parse(require('fs').readFileSync('state/health.json','utf8')).haltReason || '不明')")
            node scripts/notify.mjs "日次ジョブ: 停止中のため何もしていません（理由: $reason）。再開には halted の解除が要ります。"
            echo "::error::halted: true のため停止中です（理由: $reason）"
            exit 1
          fi

      - name: AI社員を起動（記事生成）
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          claude -p "$(cat prompts/daily.md)" \
            --model claude-haiku-4-5-20251001 \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run check),Bash(node scripts/notify.mjs:*),Bash(node scripts/discard.mjs:*)" \
            --permission-mode acceptEdits

      - name: 停止フラグを確認
        id: halt
        run: |
          halted=$(node -e "console.log(JSON.parse(require('fs').readFileSync('state/health.json','utf8')).halted === true)")
          echo "halted=$halted" >> "$GITHUB_OUTPUT"
          if [ "$halted" = "true" ]; then
            echo "AI社員が停止条件を検知して停止しました。以降の手順は飛ばします。"
          fi

      # 何も生まずに ok を記録するのが最悪の失敗の形。成功に見えて気づけない。
      # AI社員の自己申告ではなく、記事が増えたという事実で判定する。
      - name: 記事が実際に増えたか検証
        if: steps.halt.outputs.halted != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          after=$(ls content/*.md 2>/dev/null | wc -l)
          before=${{ steps.pre.outputs.count }}
          echo "記事数 $before → $after"
          if [ "$after" -le "$before" ]; then
            node scripts/notify.mjs "日次ジョブ: AI社員が新しい記事を書きませんでした（記事数 $before のまま）。無出力のまま成功扱いになるのを防ぐため失敗させます。"
            echo "::error::記事が増えていません。"
            exit 1
          fi

      # ISBN から楽天のアフィリエイトURLを機械生成する。
      # AI社員にURLを組み立てさせない（捏造の余地を作らない）。
      - name: アフィリエイトリンクを生成
        if: steps.halt.outputs.halted != 'true'
        run: npm run links

      - name: ガードレール（AI社員の申告を信用せず、ここでもう一度通す）
        if: steps.halt.outputs.halted != 'true'
        run: npm run check

      - name: サイトをビルド
        if: steps.halt.outputs.halted != 'true'
        run: npm run build

      # 判定日を過ぎていて未報告のときだけ動く。集計はコードで行い、AI社員には触らせない。
      - name: 中間判定（30日目）
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/midterm.mjs

      - name: 変更をコミット
        run: |
          git config user.name "ai-staff[bot]"
          git config user.email "ai-staff@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "daily: $(date -u +%Y-%m-%d)"
            # 週次ジョブが先に push していると弾かれる。取り込んで押し直す。
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                break
              fi
              echo "push に失敗しました。再試行します（$i/3）"
              sleep 10
              if [ "$i" = "3" ]; then
                echo "::error::push が3回失敗しました。今日の記事がコミットされていません。"
                exit 1
              fi
            done
          fi

      # halted を exit 0 で終えると Actions が緑になり、何日止まっていても気づけない。
      # 実際に 2026-10-06 から 18 日間これで見落とした。必ず赤にする。
      # AI社員が立てた halted:true を remote に残すため、コミットの後ろに置く。
      - name: 停止したなら赤で終わる
        if: steps.halt.outputs.halted == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          reason=$(node -e "console.log(JSON.parse(require('fs').readFileSync('state/health.json','utf8')).haltReason || '不明')")
          node scripts/notify.mjs "日次ジョブ: AI社員が停止条件を検知して停止しました（理由: $reason）。"
          echo "::error::AI社員が停止しました（理由: $reason）"
          exit 1

      - name: Pages 用アーティファクトをアップロード
        if: steps.halt.outputs.halted != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    if: needs.generate.outputs.halted != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  announce:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # push が弾かれたときに rebase して押し直すため全履歴が要る
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 受け渡しは固定ファイル名。日付を挟むと、ジョブ(UTC)とAI社員(JST)で1日ズレる。
      - name: X へ投稿し、投稿済みに退避する
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          enabled=$(node -e "const c=JSON.parse(require('fs').readFileSync('state/config.json','utf8'));console.log((c.posting||{}).xEnabled !== false)")
          if [ "$enabled" != "true" ]; then
            echo "state/config.json の posting.xEnabled が false なので X へは投稿しません。"
            exit 0
          fi

          file="outbox/x/next.txt"
          if [ ! -f "$file" ]; then
            echo "$file が無いので投稿しません。"
            exit 0
          fi

          # X の投稿失敗で日次ラン全体を落とさない。記事の生成も公開もここまでで済んでいる。
          # 2026-09-08 にクレジットが枯渇したあと、ここの赤が46日ぶん積み上がって
          # halted に入り、記事が書けていた日まで巻き込んで止まった。同じ轍は踏まない。
          # ただし黙って緑にはしない。Slack に出し、連続回数を health.json に残す。
          if node scripts/post-x.mjs "$(cat "$file")"; then
            posted=true
          else
            posted=false
          fi

          # 認証情報が未設定のときは post-x.mjs が投稿せず表示だけして終わるので、退避もしない
          if [ -z "$X_API_KEY" ]; then
            echo "X の認証情報が未設定のため next.txt は残します。"
            exit 0
          fi

          git config user.name "ai-staff[bot]"
          git config user.email "ai-staff@users.noreply.github.com"

          POSTED="$posted" node -e "
            const fs = require('fs');
            const h = JSON.parse(fs.readFileSync('state/health.json','utf8'));
            if (process.env.POSTED === 'true') {
              h.xConsecutiveFailures = 0;
              delete h.xLastError;
            } else {
              h.xConsecutiveFailures = (h.xConsecutiveFailures || 0) + 1;
              h.xLastError = new Date().toISOString();
            }
            fs.writeFileSync('state/health.json', JSON.stringify(h, null, 2) + '\n');
          "
          n=$(node -e "console.log(JSON.parse(require('fs').readFileSync('state/health.json','utf8')).xConsecutiveFailures || 0)")

          if [ "$posted" = "true" ]; then
            mkdir -p outbox/x
            git mv "$file" "outbox/x/posted-$(date -u +%Y-%m-%d).txt" 2>/dev/null \
              || mv "$file" "outbox/x/posted-$(date -u +%Y-%m-%d).txt"
            msg="x: 投稿済みに退避"
          else
            node scripts/notify.mjs "日次ジョブ: X への投稿に失敗しました（$n 回連続）。記事の生成と公開は成功しているので、日次ランは落としません。next.txt は明日の実行で上書きされます: $RUN_URL"
            echo "::warning::X への投稿に失敗しました（$n 回連続）。日次ランは落としません。"
            msg="x: 投稿失敗を記録（$n 回連続）"
          fi

          git add -A outbox/x state/health.json
          if git diff --staged --quiet; then
            echo "記録する変更なし"
            exit 0
          fi
          git commit -m "$msg"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push に失敗しました。再試行します（$i/3）"
            sleep 10
          done
          # ここで赤にすると X の失敗を切り離した意味が無くなるので、通知だけ出して成功させる
          node scripts/notify.mjs "日次ジョブ: X の結果を push できませんでした。xConsecutiveFailures が記録されていません: $RUN_URL"
          echo "::warning::X の結果を push できませんでした。"

  on-failure:
    needs: [generate, deploy, announce]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # push が弾かれたときに rebase して押し直すため全履歴が要る
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 連続失敗回数を加算し、3回で停止する
        run: |
          node -e "
            const fs = require('fs');
            const h = JSON.parse(fs.readFileSync('state/health.json','utf8'));
            // 停止中の実行が失敗するのは当たり前なので、二重に数えない
            if (h.halted) { console.log('既に停止中。カウンタは触らない。'); process.exit(0); }
            h.consecutiveFailures = (h.consecutiveFailures || 0) + 1;
            h.lastRunStatus = 'failed';
            if (h.consecutiveFailures >= 3) { h.halted = true; h.haltReason = '日次ジョブが3回連続で失敗'; }
            fs.writeFileSync('state/health.json', JSON.stringify(h, null, 2) + '\n');
            console.log('consecutiveFailures =', h.consecutiveFailures, 'halted =', h.halted);
          "
          git config user.name "ai-staff[bot]"
          git config user.email "ai-staff@users.noreply.github.com"
          git add state/health.json
          if git diff --staged --quiet; then
            echo "記録する変更なし"
            exit 0
          fi
          git commit -m "health: 日次ジョブ失敗を記録"
          # rebase せずに push していたため 2026-09-08〜10-03 の約1か月、
          # 加算が毎回 rejected され、失敗カウンタが remote に残らなかった。
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push に失敗しました。再試行します（$i/3）"
            sleep 10
          done
          echo "::error::失敗の記録を push できませんでした。停止条件の判定が効かなくなります。"
          exit 1

      - name: Slack へ通知
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/notify.mjs "日次ジョブが失敗しました: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
